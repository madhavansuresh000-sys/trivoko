<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- installable on a phone like an app (manifest + public/sw.js, registered in main.jsx) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TriVoKo: one cart, many sellers, one payment." />
    <title>TriVoKo</title>
    <!-- Apply the saved theme before the page paints (avoids a white flash in dark mode). A file, not an
         inline script, so the Content-Security-Policy (vercel.json) can forbid inline scripts. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
