# ---------- Common settings (all profiles) ----------
server:
  port: ${PORT:8080}        # hosting platforms tell the app its port in PORT
  tomcat:
    # Phase 7 load test: a sale start brings thousands of people in the same second. The default waiting line
    # (accept-count 100) refuses most of them; these numbers let a crowd queue instead (measured in load-tests).
    accept-count: 4000
    max-connections: 10000
    threads:
      max: 200

spring:
  application:
    name: trivoko
  profiles:
    default: dev            # when no profile is chosen, use "dev"
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway creates tables; Hibernate only checks them
    open-in-view: false
    properties:
      # load lazy lists (variants, images ...) for up to 50 products in ONE query, not one query each (N+1)
      hibernate.default_batch_fetch_size: 50
  datasource:
    hikari:
      maximum-pool-size: 40     # database connections shared by the 200 request threads (MySQL allows 151)
  flyway:
    enabled: true
  # a slow or missing mail server must never hold a request or a test for minutes (EmailSender retries later)
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # everyone sees only "UP"/"DOWN"; the admin (Phase 2) also sees database, mail and disk details
      show-details: when-authorized
      roles: ADMIN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Phase 7 flash sale: how long a claimed unit is kept for checkout, how often the job runs, and "slow down" limits
  flash:
    hold-time: 10m
    job-every: 30s
    rate-limit:
      window: 10s
      per-user: 5
      per-ip: 200
  # Phase 9: how often the price-drop job looks at wishlist rows whose price changed
  wishlist:
    alert-every: 10m
  # websites allowed to call the API from a browser (CorsConfig). Comma-separated.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  # product photos (POST /api/uploads/signature). Keys come from .env (dev) or the server's
  # environment variables (prod). Empty = upload switched off with a clear 503 message.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  # Phase 2 login (copied from EventHub). The secret signs the JWT cookie; dev and prod set it below.
  jwt:
    expiry: 8h              # how long a login lasts
  cookie:
    secure: false           # true in prod (cookie only over HTTPS)
  login:
    max-failures: 5         # wrong passwords in a row ...
    lock-time: 15m          # ... lock the login this long (LoginAttemptService)
  demo:
    # from .env (DEMO_PASSWORD): the password of the demo accounts (DevDataSeeder); empty = locked
    password: ${DEMO_PASSWORD:}
  # Phase 4: where the shop runs (payment pages send the customer back here)
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Phase 4 payments: empty key = the built-in TEST payment page (PaymentConfig); keys come from .env
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  payments:
    test-page-allowed: ${PAYMENTS_TEST_PAGE:false}
  order:
    hold-time: 10m          # stock is kept this long while the customer pays
    expiry-check: 60s       # how often the expiry job looks for unpaid orders
  scheduling:
    enabled: true           # tests switch the jobs off and call them directly
  # Phase 4 emails (notify module). In dev they land in Mailpit: http://localhost:8026
  mail:
    from: ${MAIL_FROM:TriVoKo <no-reply@trivoko.test>}
    enabled: ${MAIL_ENABLED:true}   # false = bell only (a demo server without a mail account)
    retry-every: 60s                # failed emails are tried again (at most 5 times)

---
# ---------- dev: your laptop (MySQL + Mailpit in Docker, see docker-compose.yml) ----------
spring:
  config:
    activate:
      on-profile: dev
    # read MYSQL_USER / MYSQL_PASSWORD from the project's .env file (not on GitHub)
    import: optional:file:../.env[.properties]
  datasource:
    # port 3307 (not 3306) so TriVoKo's MySQL never clashes with EventHub's.
    # Tests do NOT use this: they start their own MySQL (Testcontainers, see MySqlTestDatabase).
    url: jdbc:mysql://localhost:3307/trivoko
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  mail:
    host: localhost
    port: 1026              # Mailpit: see emails at http://localhost:8026
app:
  jwt:
    # from .env (JWT_SECRET); the fallback lets tests and CI run, and must never be used in prod
    secret: ${JWT_SECRET:dev-only-secret-not-for-production-0123456789}

---
# ---------- prod: real server (values come from environment variables, Phase 12) ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
app:
  jwt:
    secret: ${JWT_SECRET}   # no fallback: the server refuses to start without a real secret
  cookie:
    secure: true
